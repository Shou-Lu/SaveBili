name: astrbot_plugin_bili_downloader
display_name: SaveBili
short_desc: B 站与多平台视频下载工具，分平台扫码、群聊下载权限、Web配置面板
desc: 下载 B 站及多平台视频并发送至聊天窗口。B 站支持原生解析（视频/番剧/专栏/动态/收藏夹/合集）与扫码登录获取高清画质；抖音、小红书、YouTube 等站点通过 yt-dlp 下载。支持 B 站/微博/抖音扫码登录、按平台管理 Cookie、群聊下载白名单/黑名单，以及 /parse 仅解析指令。适配 aiocqhttp、QQ 官方机器人（WebSocket/Webhook）与 Telegram，内置 Web 管理页面用于账号、配置、平台分布统计与下载记录管理。
version: 1.3.1
author: 守禄
repo: https://github.com/shou-lu/SaveBili
icon: logo.png
astrbot_version: ">=4.24.1"
support_platforms:
  - aiocqhttp
  - qq_official
  - qq_official_webhook
  - telegram
tags:
  - b站
  - 抖音
  - 多平台
  - 视频下载
  - 工具
category: tool
dependencies:
  - aiohttp
  - quart
  - qrcode[pil]
  - Pillow
  - yt-dlp
